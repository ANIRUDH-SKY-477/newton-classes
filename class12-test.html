
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 12 Online Test | NEWTON CLASSES</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eef4ff;color:#172554}
header{background:#123c8c;color:white;text-align:center;padding:22px 12px}
header h1{margin:0;font-size:27px}
header p{margin:8px 0 0}
.container{max-width:760px;margin:20px auto;padding:14px}
.card{background:white;border-radius:16px;padding:20px;box-shadow:0 5px 18px #173b7515}
.progress{height:8px;background:#dbeafe;border-radius:20px;overflow:hidden;margin:12px 0 20px}
#bar{height:100%;width:0;background:#2563eb;transition:width .2s}
.option{display:block;width:100%;text-align:left;padding:13px;margin:10px 0;border:2px solid #dbeafe;border-radius:10px;background:white;color:#172554;font-size:16px;cursor:pointer}
.option:hover{border-color:#2563eb}
.option.selected{background:#dbeafe;border-color:#2563eb}
button,.link{display:inline-block;border:0;border-radius:10px;padding:12px 18px;background:#1748a0;color:white;font-size:16px;cursor:pointer;text-decoration:none;margin:5px 4px 5px 0}
button:disabled{opacity:.45;cursor:not-allowed}
.small{color:#64748b;font-size:14px}
#result{text-align:center}
.score{font-size:36px;font-weight:bold;color:#1748a0}
.hidden{display:none}
footer{text-align:center;padding:18px;color:#64748b;font-size:13px}
</style>
</head>
<body>
<header>
<h1>NEWTON CLASSES</h1>
<p>Learn Today. Lead Tomorrow.</p>
<p>कक्षा 12 ऑनलाइन टेस्ट — भौतिक विज्ञान, रसायन विज्ञान, गणित और जीव विज्ञान</p>
</header>

<div class="container">
<div class="card" id="quiz">
<div><b id="counter">प्रश्न 1 / 20</b><span style="float:right" id="answered">उत्तर दिए: 0/20</span></div>
<div class="progress"><div id="bar"></div></div>
<h3 id="question"></h3>
<div id="options"></div>
<button id="next" onclick="nextQuestion()" disabled>अगला प्रश्न →</button>
</div>

<div class="card hidden" id="result">
<h2>टेस्ट पूरा हुआ!</h2>
<p>आपका स्कोर</p>
<div class="score" id="score"></div>
<h3 id="message"></h3>
<p id="details"></p>
<button onclick="restart()">दोबारा टेस्ट दें ↻</button>
<a class="link" href="./tests.html">सभी कक्षाएँ</a>
<a class="link" href="./index.html">होम</a>
</div>
</div>
<footer>© NEWTON CLASSES • सीखते रहें, आगे बढ़ते रहें।</footer>

<script>
const bank = [
{q:"विद्युत विभव की SI इकाई क्या है?",o:["एम्पियर","वोल्ट","ओम","वाट"],a:1},
{q:"विद्युत धारिता की SI इकाई क्या है?",o:["फैराड","टेस्ला","हेनरी","वेबर"],a:0},
{q:"प्रेरित धारा की दिशा किस नियम से ज्ञात होती है?",o:["ओम का नियम","फैराडे का नियम","लेन्ज का नियम","कूलॉम का नियम"],a:2},
{q:"लेंस की क्षमता किस इकाई में मापी जाती है?",o:["मीटर","डायोप्टर","वाट","जूल"],a:1},
{q:"किस कण पर कोई विद्युत आवेश नहीं होता?",o:["प्रोटॉन","इलेक्ट्रॉन","न्यूट्रॉन","पॉजिट्रॉन"],a:2},
{q:"फोटॉन की ऊर्जा का सूत्र क्या है?",o:["mc²","hν","IR","VIt"],a:1},
{q:"p-प्रकार के अर्धचालक में बहुसंख्यक आवेश वाहक कौन होते हैं?",o:["इलेक्ट्रॉन","होल","न्यूट्रॉन","प्रोटॉन"],a:1},
{q:"चुंबकीय फ्लक्स की SI इकाई क्या है?",o:["टेस्ला","वेबर","हेनरी","फैराड"],a:1},
{q:"ट्रांसफॉर्मर किस सिद्धांत पर कार्य करता है?",o:["विद्युत अपघटन","अन्योन्य प्रेरण","प्रकाश विद्युत प्रभाव","विसरण"],a:1},
{q:"निर्वात में विद्युत चुंबकीय तरंगों की चाल लगभग कितनी होती है?",o:["3 × 10⁶ m/s","3 × 10⁸ m/s","3 × 10⁵ m/s","3 × 10¹⁰ m/s"],a:1},

{q:"25°C पर उदासीन विलयन का pH कितना होता है?",o:["0","5","7","14"],a:2},
{q:"H₂O₂ में ऑक्सीजन की ऑक्सीकरण अवस्था क्या है?",o:["−2","−1","0","+1"],a:1},
{q:"निम्नलिखित में से कौन-सा प्रबल अम्ल है?",o:["CH₃COOH","HCl","H₂CO₃","H₂O"],a:1},
{q:"CH₃CH₂OH का IUPAC नाम क्या है?",o:["मेथेनॉल","एथेनल","एथेनॉल","एथेनोइक अम्ल"],a:2},
{q:"[Co(NH₃)₆]³⁺ में कोबाल्ट की समन्वय संख्या कितनी है?",o:["3","4","6","8"],a:2},
{q:"नॉन-स्टिक बर्तनों की परत बनाने में किस बहुलक का उपयोग होता है?",o:["PVC","टेफ्लॉन","नायलॉन-6","बैकेलाइट"],a:1},
{q:"प्रथम कोटि की अभिक्रिया के वेग स्थिरांक की इकाई क्या है?",o:["mol L⁻¹ s⁻¹","s⁻¹","L mol⁻¹ s⁻¹","mol² L⁻²"],a:1},
{q:"क्लोरोफिल में कौन-सा तत्व पाया जाता है?",o:["लोहा","मैग्नीशियम","कैल्शियम","सोडियम"],a:1},
{q:"बेंजीन सामान्यतः किस प्रकार की अभिक्रियाएँ करता है?",o:["योगात्मक अभिक्रियाएँ","प्रतिस्थापन अभिक्रियाएँ","केवल उदासीनीकरण","अवक्षेपण"],a:1},
{q:"निम्नलिखित में से कौन-सा अणुसंख्यक गुणधर्म है?",o:["श्यानता","पृष्ठ तनाव","परासरण दाब","रंग"],a:2},

{q:"sin x का अवकलज क्या है?",o:["cos x","−cos x","tan x","−sin x"],a:0},
{q:"1/x का समाकलन क्या है?",o:["x² + C","ln|x| + C","1/x² + C","eˣ + C"],a:1},
{q:"आव्यूह [[1,2],[3,4]] का सारणिक क्या है?",o:["2","−2","10","−10"],a:1},
{q:"ढाल 2 वाली रेखा के लंबवत रेखा की ढाल क्या होगी?",o:["2","−2","1/2","−1/2"],a:3},
{q:"एक निष्पक्ष सिक्के को उछालने पर चित आने की प्रायिकता क्या है?",o:["0","1/4","1/2","1"],a:2},
{q:"सदिश (3,4) का परिमाण कितना है?",o:["3","4","5","7"],a:2},
{q:"यदि A एक तत्समक आव्यूह है, तो A⁻¹ क्या होगा?",o:["शून्य आव्यूह","A","−A","अपरिभाषित"],a:1},
{q:"eˣ का अवकलज क्या है?",o:["xeˣ","eˣ","ln x","1/x"],a:1},
{q:"sin 90° का मान कितना है?",o:["0","1/2","1","√3/2"],a:2},
{q:"किसी फलन का अवकलज धनात्मक होने पर वह फलन किस प्रकार का होता है?",o:["घटता हुआ","बढ़ता हुआ","हमेशा शून्य","हर जगह अपरिभाषित"],a:1},

{q:"आनुवंशिकता की मूल इकाई क्या है?",o:["कोशिका","ऊतक","जीन","अंग"],a:2},
{q:"DNA का पूरा नाम क्या है?",o:["डीऑक्सीराइबोन्यूक्लिक अम्ल","डाइन्यूक्लिक अम्ल","डीऑक्सीराइबोज नाइट्रोजन अम्ल","डबल नाइट्रोजन अम्ल"],a:0},
{q:"कोशिका का ऊर्जा गृह किस कोशिकांग को कहा जाता है?",o:["राइबोसोम","माइटोकॉन्ड्रिया","गॉल्जी बॉडी","लाइसोसोम"],a:1},
{q:"पौधे अपना भोजन किस प्रक्रिया द्वारा बनाते हैं?",o:["श्वसन","वाष्पोत्सर्जन","प्रकाश संश्लेषण","किण्वन"],a:2},
{q:"रक्त का थक्का जमाने में कौन-सी रक्त कोशिकाएँ सहायता करती हैं?",o:["लाल रक्त कोशिकाएँ","श्वेत रक्त कोशिकाएँ","प्लेटलेट्स","प्लाज्मा कोशिकाएँ"],a:2},
{q:"वृक्क (किडनी) की क्रियात्मक इकाई क्या है?",o:["न्यूरॉन","नेफ्रॉन","वायुकोष","विलस"],a:1},
{q:"इंसुलिन का उत्पादन किस अंग में होता है?",o:["थायरॉइड ग्रंथि","अग्न्याशय","अधिवृक्क ग्रंथि","पीयूष ग्रंथि"],a:1},
{q:"परागण में परागकण कहाँ से कहाँ पहुँचते हैं?",o:["जड़ से तने तक","परागकोश से वर्तिकाग्र तक","पत्ती से फूल तक","अंडाशय से बीजांड तक"],a:1},
{q:"अधिकांश जीवों में आनुवंशिक जानकारी किस अणु में होती है?",o:["DNA","ग्लूकोज","लिपिड","स्टार्च"],a:0},
{q:"पारिस्थितिकी तंत्र में ऊर्जा का पिरामिड हमेशा कैसा होता है?",o:["उल्टा","सीधा","वृत्ताकार","क्षैतिज"],a:1}
];

let questions=[], index=0, answers=[], locked=false;

function shuffle(arr){
 const copy=[...arr];
 for(let i=copy.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [copy[i],copy[j]]=[copy[j],copy[i]];
 }
 return copy;
}

function start(){
 questions=shuffle(bank).slice(0,20).map(item=>{
  const opts=item.o.map((text,i)=>({text,correct:i===item.a}));
  const mixed=shuffle(opts);
  return {q:item.q,o:mixed.map(x=>x.text),a:mixed.findIndex(x=>x.correct)};
 });
 index=0; answers=Array(20).fill(null); locked=false;
 document.getElementById("quiz").classList.remove("hidden");
 document.getElementById("result").classList.add("hidden");
 render();
}

function render(){
 const item=questions[index];
 document.getElementById("counter").textContent=`प्रश्न ${index+1} / 20`;
 document.getElementById("answered").textContent=`उत्तर दिए: ${answers.filter(x=>x!==null).length}/20`;
 document.getElementById("bar").style.width=`${index/20*100}%`;
 document.getElementById("question").textContent=item.q;
 const box=document.getElementById("options");
 box.innerHTML="";
 item.o.forEach((opt,i)=>{
  const b=document.createElement("button");
  b.className="option"+(answers[index]===i?" selected":"");
  b.textContent=String.fromCharCode(65+i)+". "+opt;
  b.onclick=()=>{
   if(locked)return;
   answers[index]=i;
   render();
  };
  box.appendChild(b);
 });
 const next=document.getElementById("next");
 next.disabled=answers[index]===null;
 next.textContent=index===19?"टेस्ट जमा करें ✓":"अगला प्रश्न →";
}

function nextQuestion(){
 if(answers[index]===null)return;
 if(index<19){index++;render();}
 else showResult();
}

function playSound(success){
 try{
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx)return;
  const ctx=new Ctx();
  [660,success?880:440].forEach((freq,i)=>{
   const osc=ctx.createOscillator(), gain=ctx.createGain();
   osc.frequency.value=freq;osc.type="sine";
   gain.gain.setValueAtTime(0.12,ctx.currentTime+i*.16);
   gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*.16+.13);
   osc.connect(gain);gain.connect(ctx.destination);
   osc.start(ctx.currentTime+i*.16);osc.stop(ctx.currentTime+i*.16+.14);
  });
 }catch(e){}
}

function showResult(){
 let score=0;
 questions.forEach((q,i)=>{if(answers[i]===q.a)score++;});
 const percent=Math.round(score/20*100);
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("score").textContent=`${score} / 20`;
 document.getElementById("message").textContent=
  percent>=80?"बहुत बढ़िया! शानदार प्रदर्शन!":
  percent>=60?"अच्छा किया! अभ्यास जारी रखें!":
  percent>=35?"अच्छी कोशिश! दोहराएँ और फिर प्रयास करें।":
  "सीखते रहें! अभ्यास से सुधार होता है।";
 document.getElementById("details").textContent=
  `प्रतिशत: ${percent}% • सही: ${score} • गलत: ${20-score}`;
 document.getElementById("bar").style.width="100%";
 playSound(percent>=60);
 window.scrollTo({top:0,behavior:"smooth"});
}

function restart(){
 start();
 window.scrollTo({top:0,behavior:"smooth"});
}
start();
</script>
</body>
</html>
